# ===============================
# DATABASE (optional for now)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/worldready
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# APP CONFIG
# ===============================
spring.application.name=world-ready-backend
server.port=8080

# ===============================
# CLAUDE (CORE AI)
# ===============================
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

# ===============================
# D-ID (AVATAR)
# ===============================
did.api.key=${DID_API_KEY:}
did.api.url=${DID_API_URL:}
did.avatar.id=${DID_AVATAR_ID:}

# ===============================
# GOOGLE MAPS (NEW)
# ===============================
google.maps.api.key=${GOOGLE_MAPS_API_KEY}