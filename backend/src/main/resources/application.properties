spring.datasource.url=jdbc:postgresql://localhost:5432/worldready
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.application.name=world-ready-backend
server.port=8080

anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

did.api.key=${DID_API_KEY:}
did.api.url=${DID_API_URL:}
did.avatar.id=${DID_AVATAR_ID:}

elevenlabs.api.key=${ELEVENLABS_API_KEY:}
elevenlabs.voice.id=${ELEVENLABS_VOICE_ID:}
deepgram.api.key=${DEEPGRAM_API_KEY:}
assemblyai.api.key=${ASSEMBLYAI_API_KEY:}